# Docker Compose for paper-hub.cn
#
# Usage:
#   DEV_PORT=8080 docker compose up -d         # uses port 8080
#   DEV_PORT=8081 npm run dev                  # same via npm wrapper
#
# All three services (backend, frontend, nginx) communicate
# over the internal docker network.  Only the nginx port is
# exposed to the host — no port conflicts.
#
# Python venv (backend/.venv):
#   The host's backend/.venv is isolated from the container via an
#   anonymous volume at /app/.venv, so the two don't interfere.
#   The container creates its own venv on first startup via uv run.
#
# User namespace:
#   Backend and frontend containers run as the host user to
#   prevent root-owned files in bind-mounted directories.
#   Defaults to 1000:1000; override via UID/GID:
#     UID=$(id -u) GID=$(id -g) docker compose up

services:
  # Django backend
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: paperhub-backend
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
      - /app/.venv # isolate container's venv from host's
      - backend-static:/app/static_root
      - backend-media:/app/media
    env_file:
      - .env.docker
    environment:
      - DJANGO_ENV=development
      - DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
    # No ports exposed to host — internal only
    # uv sync runs inside the container on first startup (isolated venv).
    command: >
      sh -c "
        uv sync &&
        uv run python manage.py migrate --noinput &&
        uv run python manage.py runserver 0.0.0.0:8000
      "
    restart: unless-stopped
    networks:
      - paperhub-network

  # React frontend (Vite dev server)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: paperhub-frontend
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # No ports exposed to host — internal only
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - paperhub-network

  # Nginx reverse proxy — single entry point
  nginx:
    image: nginx:alpine
    container_name: paperhub-nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - backend-static:/static:ro
    ports:
      - "${DEV_PORT:-8000}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - paperhub-network

networks:
  paperhub-network:
    driver: bridge

volumes:
  backend-static:
  backend-media:
