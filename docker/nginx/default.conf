# Nginx configuration for paper-hub.cn
#
# Development mode:
#   Single entry point (default port 8000) that routes:
#   - /api/, /admin/  → Django backend
#   - /static/        → Django backend (dev mode)
#   - /*              → Vite dev server (SPA with HMR)
#
# Production mode (see docker/nginx/production.conf):
#   - /static/   → served directly by nginx
#   - /api/, /admin/ → Django/gunicorn backend
#   - /*             → built SPA index.html
#
# Note: Upstream hostnames (backend, frontend) are resolved via Docker
# internal DNS at 127.0.0.11.  To avoid nginx startup failures when
# the upstream containers are not yet resolvable, we use variables in
# proxy_pass so hostnames are resolved at RUNTIME, not at config load.
# See: https://nginx.org/en/docs/http/ngx_http_core_module.html#resolver

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # ── Django admin & API ──────────────────────────────────────
    # These MUST come before the catch-all / block so they
    # are never intercepted by the SPA.
    location /admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static files ────────────────────────────────────────────
    # In dev mode, proxy to Django's runserver (which handles them).
    location /static/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Favicon / root-level assets ─────────────────────────────
    location = /favicon.ico {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }

    location = /robots.txt {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }

    # ── SPA catch-all (including /group/xiangma/, /, etc.) ─────
    # All routes not matched above go to the React dev server.
    # The SPA handles client-side routing for /group/:groupName/...
    # This will NEVER match /api/ or /admin/ because those
    # location blocks take priority.
    location / {
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
